name: Trigger auto deployment for server-sentinel

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/server-sentinel-AutoDeployTrigger-e280200a-16b4-432c-b2bf-5dd6ceec8bc8.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SERVERSENTINEL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SERVERSENTINEL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SERVERSENTINEL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: myaiopsegistry.azurecr.io
          registryUsername: ${{ secrets.SERVERSENTINEL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SERVERSENTINEL_REGISTRY_PASSWORD }}
          containerAppName: server-sentinel
          resourceGroup: my-rg-aiops
          imageToBuild: myaiopsegistry.azurecr.io/server-sentinel:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


